v.querySelectorAll("select[data-bf]").forEach(b=>b.onchange=()=>{S.bf[b.dataset.bf]=b.value;if(b.dataset.bf=="d")S.gd=b.value=="All"?null:b.value;shell()});
const hd=document.getElementById("hd");if(hd)hd.onchange=()=>{S.bf.d=hd.value;S.gd=hd.value=="All"?null:hd.value;shell()};
const hfy=document.getElementById("hfy");if(hfy)hfy.onchange=()=>{S.bf.fy=hfy.value;shell()};
const nt=document.getElementById("nt");if(nt)nt.onclick=notif;
const gs=document.getElementById("gs");if(gs)gs.onkeydown=e=>{if(e.key=="Enter"&&gs.value.trim())searchModal(gs.value.trim())};
v.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{S.dt=b.dataset.dt;view()});
v.querySelectorAll("path[data-d]").forEach(b=>b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();b.onclick()}});
v.querySelectorAll("[data-gd]").forEach(b=>{const f=()=>{S.gd=b.dataset.gd;view()};b.onclick=f;b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f()}}});
const gml=document.getElementById("gml");if(gml)gml.onchange=()=>{S.gm=gml.value;view()};
v.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{const r=REPS.find(x=>x[0]==b.dataset.rp);toast("Generating "+r[1]+"…");setTimeout(()=>{S.gen.unshift(r[1]+" — "+new Date().toLocaleTimeString());S.log.unshift(new Date().toLocaleTimeString()+" · Report generated: "+r[1]+" by "+S.role);modal(repHtml(r[0])+'<p><button onclick="repCopy()">Copy text</button></p>');if(S.page=="rep")view()},800)});
v.querySelectorAll("[data-pm]").forEach(b=>b.onchange=()=>{const[r,g]=b.dataset.pm.split("|"),a=S.perm[r];if(b.checked){if(!a.includes(g))a.push(g)}else S.perm[r]=a.filter(x=>x!=g);S.log.unshift(new Date().toLocaleTimeString()+" · Permission "+g+" "+(b.checked?"granted to ":"removed from ")+r+" by "+S.role);toast("Permission updated (synthetic)")});
v.querySelectorAll("[data-us]").forEach(b=>b.onclick=()=>{const u=S.users[+b.dataset.us];u.on=!u.on;S.log.unshift(new Date().toLocaleTimeString()+" · User "+u.id+(u.on?" enabled":" disabled")+" by "+S.role);toast(u.id+(u.on?" enabled":" disabled")+" (synthetic)");view()});
const cth=document.getElementById("cfgth");if(cth)cth.onchange=()=>{S.cfg.th=+cth.value;S.log.unshift(new Date().toLocaleTimeString()+" · High-risk threshold set to "+S.cfg.th+" by "+S.role);toast("Threshold "+S.cfg.th+": Drill-down transactions re-classified");view()};
const rst=document.getElementById("rst");if(rst)rst.onclick=resetAll;
v.querySelectorAll("[data-ddn]").forEach(b=>{const f=()=>{S.dd.push(b.dataset.ddn);S.ddf.r="All";view()};b.onclick=f;b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f()}}});
v.querySelectorAll("[data-ddb]").forEach(b=>b.onclick=()=>{S.dd=S.dd.slice(0,+b.dataset.ddb+1);S.ddf.r="All";view()});
const ddk=document.getElementById("ddback");if(ddk)ddk.onclick=()=>{if(S.dd.length>1){S.dd.pop();S.ddf.r="All";view()}};
const ddr=document.getElementById("ddr");if(ddr)ddr.onchange=()=>{S.ddf.r=ddr.value;view()};
const exr=document.getElementById("exr");if(exr)exr.onchange=()=>{S.xf=exr.value;view()};
v.querySelectorAll("[data-xp]").forEach(b=>{const f=()=>xModal(b.dataset.xp);b.onclick=f;b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f()}}});
v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const x=RM()[+b.dataset.rm],L=["Low","Medium","High"];modal(`<span class="tag WATCH">AI SIGNAL</span> <small>NOT AUTOMATIC DECISION</small><h3>${x[0]}</h3><dl class="ex"><dt>WHAT</dt><dd>Likelihood ${L[x[1]]} · Impact ${L[x[2]]}</dd><dt>WHY</dt><dd>${x[3]}</dd><dt>CONFIDENCE</dt><dd>${x[5]}%</dd><dt>RECOMMENDED ACTION</dt><dd>${x[4]}</dd><dt>HUMAN DECISION</dt><dd>Pending Finance Secretary review</dd></dl>`)});
v.querySelectorAll("[data-sk]").forEach(b=>{const f=()=>{const[n,val]=b.dataset.sk.split("|");modal(`<h3>${n}</h3><p>₹${(+val).toLocaleString("en-IN")} Cr · ${(val/957).toFixed(1)}% of total flow (synthetic)</p>${n=="Borrowings"&&S.rev?"<p><b>Demo event applied:</b> borrowing need rises by ₹212 Cr to cover the revenue shortfall.</p>":""}<small>AI signal for review, not an automatic decision.</small>`)};b.onclick=f;b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f()}}});
v.querySelectorAll("[data-dq]").forEach(b=>b.onclick=()=>{const[i,a]=b.dataset.dq.split("|"),x=S.dq[+i];if(a=="CLEANSE"){x.c=Math.round(x.c*.7);x.st="Cleansing run"}else{x.own="Data Steward (Fiscal AI Wing)";if(x.st=="Open")x.st="Assigned"}S.log.unshift(new Date().toLocaleTimeString()+" · Data quality: "+x.n+" "+a.toLowerCase()+" by "+S.role);toast(x.n+": "+a.toLowerCase()+" (synthetic)");view()});
v.querySelectorAll("[data-en]").forEach(b=>b.onclick=()=>{const n=ENT[+b.dataset.en];modal(`<h3>${n[0]} · ${n[1]}</h3><p>Synthetic identifier. No real personal data is held or shown.</p><p>Link confidence to next record: ${ENC[+b.dataset.en]!=null?ENC[+b.dataset.en]+"%":"end of chain"}</p>`)});
v.querySelectorAll("[data-sy]").forEach(b=>b.onclick=()=>{const r=sysRows()[+b.dataset.sy];modal(`<h3>${r.n} — ${r.st}</h3><p>Latency ${r.lat} ms · Throughput ${r.thr} · Events/sec ${r.eps} · Freshness ${r.fr}s</p><small>Synthetic telemetry for demonstration.</small>`)});
const sr=document.getElementById("sysrun");if(sr)sr.onclick=()=>{toast("Running health check…");setTimeout(()=>toast("Health check complete (synthetic)"),900)};
const sf=document.getElementById("sysf");if(sf)sf.onclick=()=>{S.fault=!S.fault;S.log.unshift(new Date().toLocaleTimeString()+" · "+(S.fault?"Synthetic Kafka lag fault injected":"Synthetic fault cleared")+" by "+S.role);toast(S.fault?"Fault injected: data lag":"Fault cleared");shell()};
v.querySelectorAll("[data-pj]").forEach(b=>{b.onclick=()=>pjModal(+b.dataset.pj);b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();pjModal(+b.dataset.pj)}}});
const pjd=document.getElementById("pjd");if(pjd)pjd.onchange=()=>{S.sf.d=pjd.value;view()};
const pjr=document.getElementById("pjr");if(pjr)pjr.onchange=()=>{S.sf.r=pjr.value;view()};
const pjs=document.getElementById("pjs");if(pjs)pjs.onclick=()=>{S.sf.sort=S.sf.sort=="risk"?"alloc":"risk";view()};
v.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{S.tf=b.dataset.tf;view()});
v.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>{const[i,a]=b.dataset.tx.split("|"),x=S.tsbx[i],m={REVIEW:"Under review",ESCALATE:"Escalated",CLOSE:"Closed"};x.st=m[a];S.log.unshift(new Date().toLocaleTimeString()+" · TSB "+x.id+" "+m[a]+" by "+S.role);toast("TSB exception: "+m[a]+" (synthetic state only)");view()});
v.querySelectorAll("[data-px]").forEach(b=>b.onclick=()=>{const[i,a]=b.dataset.px.split("|"),x=S.penx[i],m={REVIEW:"Under review",ESCALATE:"Escalated",HOLD:"Payment on hold"};x.st=m[a];S.log.unshift(new Date().toLocaleTimeString()+" · Pension "+x.id+" "+m[a]+" by "+S.role);toast("Pension case: "+m[a]+" (synthetic state only)");view()});
v.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{S.ft=b.dataset.ft;view()});
const fr=document.getElementById("fr");if(fr)fr.onchange=()=>{S.cf.r=fr.value;view()};
const fst=document.getElementById("fst");if(fst)fst.onchange=()=>{S.cf.s=fst.value;view()};
const fsb=document.getElementById("fsb");if(fsb)fsb.onclick=()=>{S.cf.sort=!S.cf.sort;view()};
v.querySelectorAll("[data-hz]").forEach(b=>b.onclick=()=>{S.hz=+b.dataset.hz;view()});
v.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=NODES[b.dataset.n];modal(`<h3>${n[0]} · ${n[1]}</h3><p>${n[2]}</p><small>Synthetic entity. AI signal for human review.</small>`)});
const adv=document.getElementById("adv");if(adv)adv.onclick=()=>{S.case++;S.log.unshift(new Date().toLocaleTimeString()+" · INV-SYN-2026-0117 → "+CASE[S.case]+" by "+S.role);toast("Case moved to "+CASE[S.case]);view()};
v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const[i,a]=b.dataset.c.split("|"),c=S.ctrl[i],m={REVIEW:"Under review",ESCALATE:"Escalated",HOLD:"On hold",RELEASE:"Released"};c.st=m[a];S.log.unshift(new Date().toLocaleTimeString()+" · "+c.t+" "+m[a]+" by "+S.role);toast(c.t+": "+m[a]+" (synthetic state only)");view()});
v.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>alertModal(b.dataset.al));
v.querySelectorAll("[data-rg]").forEach(b=>b.onclick=()=>{S.range=b.dataset.rg;view()});
v.querySelectorAll("[data-p2]").forEach(b=>b.onclick=()=>{S.page=b.dataset.p2;shell()});
v.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const t=KL[b.dataset.k];modal(`<h3>${b.dataset.k}</h3><p>Open the related module, or explore the figure by district and department.</p><p>${t?`<button class="pri" onclick="goPage('${t}')">Open related module</button> `:""}<button onclick="ddGo()">Open Drill-down Explorer</button></p><small>Synthetic data.</small>`)});
v.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const d=API.districts.find(x=>x.n==b.dataset.d);modal(`<h3>${d.n} district</h3>${dstHtml(d.n)}<p><button class="pri" onclick="ddOpen('${d.n}')">Open in Drill-down Explorer</button></p>`)});
v.querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>{const d=API.depts.find(x=>x[0]==b.dataset.dp);modal(`<h3>${d[0]}</h3><p>Based on current expenditure trajectory, ${d[0]} is projected to utilise ${d[1]}% of its allocation by year-end. Estimated under-utilisation: ₹${Math.round(d[2]*(100-d[1])/100)} crore. Confidence: 87%.</p>`)});
v.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>ask(b.dataset.q));
v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const r=S.recon[b.dataset.m];r.st="Matched";r.gst=r.ifms;r.age=0;r.pr="LOW";if(r.cin=="20269999")API.health["Reconciliation Health"][1]=77;S.log.unshift(new Date().toLocaleTimeString()+" · CIN "+r.cin+" matched by "+S.role);toast("CIN "+r.cin+" matched (synthetic)");view()});
v.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const r=S.recon[b.dataset.x];r.st="Exception raised";S.log.unshift(new Date().toLocaleTimeString()+" · Exception raised for CIN "+r.cin+" by "+S.role);toast("Exception created (synthetic)");view()});
v.querySelectorAll("[data-moe]").forEach(b=>b.onclick=()=>{const r=S.recon[b.dataset.moe];r.st="MoE issued";S.log.unshift(new Date().toLocaleTimeString()+" · MoE generated for CIN "+r.cin+" by "+S.role);toast("Memo of exception generated (synthetic)");view()})}
function alertModal(id){const a=S.alerts.find(x=>x.id==id);S.read.add(id);refreshBadge();modal(`<span class="tag ${a.sev}">${a.sev}</span> <span class="tag WATCH">AI SIGNAL</span> <small>NOT AUTOMATIC DECISION</small><h3>${a.id} — ${a.t}</h3><dl class="ex"><dt>WHAT</dt><dd>${a.what}</dd><dt>WHY</dt><dd>${a.why}</dd><dt>EVIDENCE</dt><dd>${a.ev.join(" · ")}</dd><dt>CONFIDENCE</dt><dd>${a.conf}%</dd><dt>IMPACT</dt><dd>${a.imp}</dd><dt>RECOMMENDED ACTION</dt><dd>${a.act}</dd><dt>HUMAN DECISION</dt><dd>${a.st}</dd></dl>${DECIDERS.includes(S.role)?"":"<p><small>Read-only role: decisions are recorded by authorised officials.</small></p>"}<p><button class="pri" id="ap">Approve</button> <button id="rj">Reject</button> <button id="es">Escalate</button></p>`);
[["ap","Approved"],["rj","Rejected"],["es","Escalated"]].forEach(([b,s])=>{document.getElementById(b).onclick=()=>{a.st=s+" by "+S.role;S.log.unshift(new Date().toLocaleTimeString()+" · "+a.id+" "+a.st);document.querySelector(".modal").remove();toast("Decision recorded in audit trail");view()}})}
setInterval(()=>{const c=$("#clk");if(c)c.textContent=new Date().toLocaleTimeString()},1000);
try{S.lang=localStorage.getItem("aiifms_lang")==="ml"?"ml":"en"}catch(e){S.lang="en"}document.documentElement.lang=S.lang=="ml"?"ml":"en";login();
</script></body></html>
